# Okaylist — Render Blueprint (free tier)
# Dashboard: New → Blueprint → connect this repo / branch
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: okaylist-db
    plan: free
    region: oregon
    databaseName: okaylist
    user: okaylist
    postgresMajorVersion: "16"

services:
  - type: web
    name: okaylist
    runtime: node
    region: oregon
    plan: free
    branch: cursor/manual-playlist-ba17
    autoDeployTrigger: commit
    # Free tier: no preDeployCommand. Start Next immediately so the port binds
    # while migrate/seed run alongside (see scripts/start.sh).
    buildCommand: npm ci && npm run build
    startCommand: bash scripts/start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: okaylist-db
          property: connectionString
